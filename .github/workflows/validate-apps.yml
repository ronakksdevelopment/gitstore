name: Validate app submission

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List files changed outside apps/
        id: scope-check
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          OUTSIDE=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- . ':!apps/**')
          echo "outside<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTSIDE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fail if PR touches files outside apps/
        if: steps.scope-check.outputs.outside != ''
        run: |
          echo "## ❌ gitstore listing check failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This PR changes files outside \`apps/\`, which submission PRs aren't allowed to do:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.scope-check.outputs.outside }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: List changed apps/*.json files
        id: changed
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'apps/*.json')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate listing files
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node .github/scripts/validate-apps.js

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            let body = 'Automated check finished — see the Checks tab for details.';
            try {
              body = fs.readFileSync(summaryPath, 'utf8') || body;
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
